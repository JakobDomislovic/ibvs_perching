# ibvs_controller.py parameters -- OPTITRACK VARIANT (startup/optitrack).
#
# Identical tuning to startup/real_world -- see that directory's copy of this
# file for the full history behind every value below; every gain here means
# exactly what it means there. The only difference in this startup is the
# ALTITUDE SOURCE: start_optitrack.sh passes use_optitrack:=true to
# ibvs_udp.launch, so the controller subscribes DIRECTLY to
# vrpn_client/estimated_odometry (no relay node in between) for its
# altitude (takeoff_height, hover_height, land_disarm_height -- X-Y is
# unaffected, that is still pure image-error IBVS), instead of
# mavros/local_position/odom, which never gets a real fix with no GPS / no
# mocap fed into the FCU (see ibvs_controller.py). The same vrpn_client
# topic can also just be watched directly (RViz / PlotJuggler / rostopic
# echo), independent of whether the controller is using it.
#
# Off-board detection: the PiOS companion detects the target and streams its
# pixel position over UDP; udp_target_receiver republishes ibvs/target_point
# and this controller flies ArduPilot directly (mavros/setpoint_raw/attitude).
# There is NO range sensor -- the vertical axis is open-rate.
#
# The safety pilot flies MANUALLY (STABILIZE). The controller streams
# setpoints continuously; ArduPilot only acts on them in GUIDED_NOGPS, and
# the PILOT is the one who selects that on the RC mode switch -- this node
# never changes the flight mode by itself. Flipping the switch away hands
# control back instantly, from any state.
#
# GUID_OPTIONS must be 0 on the FCU (set in the startup session): thrust is a
# CLIMB RATE (0.0 max descent, 0.5 hover, 1.0 max climb), NOT raw thrust.

# ---------------------------------------------------------------------------
# Mission mode: 'land' (down cam, descend + disarm), 'perch' (up cam, climb
# toward the branch), or 'hover' (BENCH TEST: hold hover_height via
# closed-loop PID -- see pid_z below -- completely independent of X-Y, so
# the IBVS cascade can be characterized with Z locked at a known height;
# needs use_optitrack:=true, i.e. this startup, not startup/real_world).
# Override per run from the launch (mission_mode:=perch / mission_mode:=hover).
#
# CURRENTLY: LAND. To go back to PERCH, three things move together --
#   mission_mode here            perch
#   image_x_sign below          -1.0   (image_y_sign is +1.0 in BOTH modes)
#   MISSION_MODE in start_udp.sh perch  <- the launch sets mission_mode as an
#       explicit <param> AFTER the <rosparam> load, so this yaml alone does
#       NOT take effect; start_udp.sh wins.
# ---------------------------------------------------------------------------
mission_mode: hover

# Image->body sign per axis. The controller ASSUMES point.x positive RIGHT and
# point.y positive DOWN (ordinary top-left-origin image convention, which the
# PiOS detector does use). These knobs mirror the ERROR about the image centre,
# so they set which way the vehicle leans for a given detection offset.
#
# The rule: the commanded lean must point toward where the target PHYSICALLY
# is, not toward where it appears in the image.
#
#   LAND  down-facing camera   image_x_sign: +1.0   image_y_sign: +1.0
#         Flight-validated: 104/104 detections correct in both engagement
#         windows of 2026-08-18-11-54-50.bag.
#
#   PERCH up-facing camera     image_x_sign: -1.0   image_y_sign: +1.0
#         The same physical camera turned to face up, which inverts the x
#         axis only. Bench-measured 2026-08-20: an ArUco held to the drone's
#         RIGHT was detected at px=(381, 361) -- 259 px LEFT of centre, and
#         level in y -- so image-left = drone-right. y is unchanged from LAND.
#
# Check any change with:  ./sim_tilt.py --sweep
image_x_sign: 1.0             # LAND (down cam). PERCH (up cam) would be -1.0
image_y_sign: 1.0             # LAND (down cam). Same value in PERCH

# ---------------------------------------------------------------------------
# Engagement (real world): the FCU mode is the PILOT'S. This node never
# switches it -- only the explicit ibvs/takeoff service may. ibvs/stop
# disables servoing, ibvs/start re-enables it.
# ---------------------------------------------------------------------------
engage_on_target: true        # skip CLIMB and servo straight away once armed
                              # and in GUIDED_NOGPS. The controller does NOT
                              # switch the mode: the PILOT selects
                              # GUIDED_NOGPS and ibvs/start enables servoing.

# OptiTrack HEIGHT -> FCU (mavros/vision_pose/pose), so ArduPilot's climb-rate
# loop uses the real height instead of its EKF's (which followed a junk indoor
# GPS fix in 2026-09-25-12-30-26.bag). x/y are sent as 0 -- height only.
# FCU must have: VISO_TYPE 1, EK3_SRC1_POSZ 6, EK3_SRC1_POSXY 0,
# EK3_SRC1_VELXY 0, EK3_SRC1_VELZ 0, EK3_SRC1_YAW 1 (reboot after VISO_TYPE).
# DOES NOTHING ON THIS VEHICLE: its firmware (Copter-Larics-4.3.3) has no
# VISO_TYPE parameter, i.e. it was built without visual odometry and drops
# VISION_POSITION_ESTIMATE (checked 2026-09-29). Kept for a future firmware.
send_vision_height: false
vision_height_rate: 30.0      # [Hz] OptiTrack runs ~200 Hz; this throttles it

control_rate: 30.0            # [Hz] rate at which AttitudeTarget is published

# ---------------------------------------------------------------------------
# Vertical axis -- open-rate climb control through the thrust field (no range
# sensor). 0.0 max descent, 0.5 hover, 1.0 max climb.
# ---------------------------------------------------------------------------
hover_thrust: 0.5             # zero-climb-rate ("hover") command
climb_thrust: 0.52            # only used by the ibvs/takeoff CLIMB path
thrust_min: 0.45              # clamp: gentlest allowed descent command
thrust_max: 0.6               # clamp: strongest allowed climb command
takeoff_height: 1.0           # [m] only used by the ibvs/takeoff CLIMB path

hover_height: 1.3             # [m] mission_mode 'hover' ONLY: the fixed height
                              # target held via pid_z below. Set equal to
                              # takeoff_height for a clean test, otherwise
                              # CLIMB over/undershoots this and pid_z has an
                              # avoidable step correction to make at handoff.

perch_climb_thrust: 0.55      # PERCH: constant climb while centered on the branch
land_descend_thrust: 0.45     # LAND: constant slow descent while centered

# LAND terminal: disarm once centered (within descend_xy_gate) and below
# land_disarm_height (odometry altitude), held for land_disarm_dwell seconds.
disarm_on_land: true
land_disarm_height: 0.15      # [m] odometry altitude below which disarm triggers
land_disarm_dwell: 0.3        # [s] condition must hold this long before disarm

# ---------------------------------------------------------------------------
# X-Y axis -- CASCADE on the image error, with an IMU attitude inner loop:
#   desired_tilt = PID_xy(error)                     (clamped to max_tilt)
#   body_rate    = kp_att * (desired_tilt - current_tilt)
# The error is the detection's offset from centre normalized per axis by its
# own half-dimension, so it is +-1.0 at that axis' frame edge. No fx/fy, no
# depth_guess, NO CAMERA CALIBRATION anywhere in the chain.
# ~image_width / ~image_height come from the launch, not from here, so they
# cannot drift from the resolution the detector actually reports.
#
# Attitude comes from mavros/imu/data (the FCU's AHRS), which needs no
# position solution -- it works with no GPS and no OptiTrack. This is the
# overshoot fix: the inner loop actively pulls the built-up tilt back toward
# level as the error shrinks, which a bare rate command could never do.
# ---------------------------------------------------------------------------
target_x: 0.0                 # desired lateral offset, frame-fraction (0 = centred)
target_y: 0.0                 # desired lateral offset, frame-fraction (0 = centred)
descend_xy_gate_px: 70        # [px] descend/climb only while centred within this.
                              # Kept LARGER than align_tolerance_px so ALIGNED
                              # always implies the descent is allowed.

# How the desired tilt is sent to the FCU:
#   attitude  publish the target ATTITUDE quaternion and let ArduPilot close
#             the attitude loop (400 Hz, tuned ATC_* gains). Requires sane
#             ATC_ANG_RLL_P / ATC_ANG_PIT_P on the vehicle.
#   rate      publish a body rate from our own kp_att loop (previous
#             behaviour). Switch to this to A/B the two on the bench.
command_mode: attitude

# TEST SETTING -- 2 deg. This is the SPEED limit, and the main safety knob:
# the vehicle can never be commanded steeper than this, however big the pixel
# error gets, so it also bounds how much damage a wrong sign can do.
#
#   tilt     max lateral accel    steady approach speed (g*sin(t)/c, c~0.75)
#   1 deg        0.17 m/s2            0.23 m/s
#   2 deg        0.34 m/s2            0.46 m/s   <-- here: ~4.4 s to cross 2 m
#   5 deg        0.86 m/s2            1.14 m/s
#   8.6 deg      1.47 m/s2            1.96 m/s   (the old 0.15 rad)
#
# CAUTION at 2 deg: the drift back-derived from the ROLL axis of
# 2026-08-17-18-30-59.bag is ~0.25 m/s2 (that axis had the correct sign, so its
# standing error is genuine steady state). That eats 1.44 deg = 72% of a 2 deg
# budget, leaving only ~0.10 m/s2 to actually manoeuvre with. Fine for a slow
# direction-check; raise to 3-5 deg if it cannot make headway.
max_tilt: 0.052               # [rad] desired-tilt clamp (3.0 deg; was 0.035 = 2 deg until 2026-10-02)

# RATE mode only (ignored when command_mode is 'attitude').
kp_att: 1.5                   # [1/s] inner loop: body rate per rad of tilt error
max_body_rate: 0.35           # [rad/s] clamp for both roll/pitch rate (~20 deg/s).
                              # Keep >= kp_att * max_tilt (= 0.225 here) or the
                              # inner loop saturates before it can track a
                              # full-scale tilt command.

# ---------------------------------------------------------------------------
# OUTER-loop PID gains. UNITS: kp is rad of TILT per unit frame-fraction, so
# kp IS the tilt commanded at the frame edge (kp 0.06 => 3.4 deg there). This
# is a TILT, not a rate; the inner attitude loop turns it into one.
#
# RETUNED against 2026-08-17-18-30-59.bag, the first bag that engaged. It shows
# kp 0.06 commanding only ~1 deg of tilt while the error GREW to 0.42/-0.59 of
# the frame and stayed there, across all three engagement windows.
#
# That is not divergence, it is the steady-state error a pure-P outer loop
# MUST have against a constant disturbance (wind, AHRS trim):
#
#     err_ss = (a_dist / g) / kp        frame-fractions
#
#     kp      0.15 m/s2   0.30 m/s2   0.50 m/s2
#     0.06         0.25        0.51        0.85     <-- what that bag flew
#     0.12         0.13        0.25        0.42
#     0.20         0.08        0.15        0.25
#
# At kp 0.06, 0.3 m/s^2 of drift needs HALF THE FRAME of standing error, which
# is what the bag recorded. Two fixes, both applied: raise kp, and give the
# loop an INTEGRATOR so a steady disturbance is trimmed out instead of being
# balanced by standing error. Simulated (attitude mode, 0.3 m/s^2 disturbance,
# 5.09 Hz detector as measured in that bag, 10 seeds):
#
#     kp .06 ki 0    kd .12   peak 0.526  never settles  final 0.510
#     kp .12 ki 0    kd .20   peak 0.307  never settles  final 0.255
#     kp .12 ki .02  kd .20   peak 0.306  settles  9s    final 0.000  <-- this
#     kp .12 ki .05  kd .20   peak 0.305  settles  6s    final 0.000
#
# Still gentle: kp 0.12 is 6.9 deg of tilt at the frame edge, and max_tilt
# caps everything at 8.5 deg. Raising the detection rate remains the single
# best available improvement.
#
# kd: the old bare-rate law needed c*kd > kp just to avoid diverging. That
# knife edge is gone -- desired_tilt is clamped and bounded now. But kd=0
# still oscillates without settling, so keep it non-zero.
# NOT yet flight tested in this form.
# ---------------------------------------------------------------------------
pid_xy:
  # P-ONLY TEST SETTING. kp and max_tilt are INDEPENDENT knobs and it is worth
  # not confusing them: max_tilt caps the SPEED (safety), kp sets the STANDING
  # ERROR. Lowering kp does not make the test gentler, it only makes it less
  # accurate -- pure P must hold err_ss = (a_drift/g)/kp to balance the drift:
  #
  #   kp     saturates at |err|   standing error at 0.25 m/s2 of drift
  #   0.035        1.00 (edge)        0.72   <- target nearly leaves the frame
  #   0.070        0.50               0.36
  #   0.140        0.25               0.18   <- here: ~115 px in x, ~65 px in y
  #
  # kp 0.14 with max_tilt 0.035 means the outer 3/4 of the frame just commands
  # a flat 2 deg and the last quarter is proportional. That is deliberate: full
  # (slow) authority while far out, gentle as it closes.
  # 2026-10-08: kp .28 / ki .05 / kd .35 / d_filter .45 (tuned in simulation) flew WAY too aggressive
  # (2026-10-08-08-33-12.bag): fast tilting + the ~50 ms late attitude in virtual_camera (no frame
  # "age" from the detector yet) made the compensated point jump ~40 px, which the strong, barely
  # filtered D term amplified. Back to the gains that flew well. Raise kd only once "age" is sent.
  # 2026-10-08 BRANCH at hover_height 1.0 m: all three gains / 3. The loop gain in PIXELS scales with
  # 1/(camera-to-target distance); the branch at 1.5 m already moved 1.6x more px per metre than the
  # floor tag and orbited (2.9 s period, 2026-10-08-08-57-04.bag), and 1.0 m is closer still (~2.5-3.5x).
  # Same kp:kd:ki ratio = same damping, just slower. Floor-tag-at-1.5 m values were kp .20 ki .03 kd .18.
  kp: 0.10                    # [rad per unit]
  ki: 0.011                   # OFF for this test (old note). Note pure P CANNOT remove the
                              # standing error above -- it needs a permanent
                              # offset to generate the tilt that balances drift.
                              # Set ~0.02 once the direction is confirmed.
  kd: 0.09                    # was 0.09 until 2026-10-02: doubled for more damping of the
                              # slow (~5 s) aligned wobble -- safe now that the D term sees
                              # the VIRTUAL (tilt-compensated) error. OFF for this test (old note). This is the braking term: it
                              # is what commands tilt AWAY before arrival, so
                              # with kd 0 expect overshoot on the way in.
  i_max: 0.025                 # [rad] max integral contribution -- this is the
                              # trim authority: 0.05 rad of tilt cancels about
                              # g*0.05 = 0.49 m/s^2 of steady disturbance, and
                              # bounds how far the integrator can wind up
  d_filter: 0.15              # EMA on the differentiated detection (1.0 = off)
  d_max_dt: 0.40              # [s] longest detection gap still differentiated;
                              # beyond it the D term is zeroed instead of
                              # computed across the gap.
                              # WAS 0.15, which sat just BELOW the measured
                              # median gap of 0.157 s -- so the D term was
                              # being discarded on ~80% of detections and kd
                              # was very nearly inert (simulated: overshoot
                              # 0.369 vs 0.394 for pure P). 0.40 is ~2.5x the
                              # median gap: D survives normal detections and
                              # is still rejected across the real stalls.

# ---------------------------------------------------------------------------
# mission_mode 'hover' ONLY -- closed-loop height PID toward hover_height,
# via odometry altitude (last_odom, needs use_optitrack -- see above).
# UNTESTED: these are conservative starting guesses, not flight-derived like
# pid_xy above (which has none of that history yet either). Bench/tether
# test first: hand-hold or tie the vehicle down and watch the commanded
# thrust track a step change in hover_height before ever flying it free.
# Units: kp/ki/kd are thrust-units of climb-rate command per meter (or
# m/s, or m*s) of height error -- same structure as pid_xy, just against a
# fixed setpoint instead of a moving detection.
# ---------------------------------------------------------------------------
pid_z:
  kp: 0.05                    # [thrust/m] 1 m of error -> +0.1 thrust
  ki: 0.0001                      # OFF -- enable only once the sign/direction
                              # is confirmed on the bench (same reasoning
                              # as pid_xy/ki above)
  kd: 0.15                     # [thrust per m/s] damps the approach so it
                              # doesn't overshoot hover_height and oscillate
  i_max: 0.05                  # [thrust] max integral contribution

# ---------------------------------------------------------------------------
# thrust_mode 'raw' ONLY (THRUST_MODE in start_optitrack.sh, which also sets
# the FCU's GUID_OPTIONS to 8 to match). Thrust is then MOTOR THROTTLE, not a
# climb rate, and this PID on OptiTrack height is the only height loop:
#     throttle = raw_hover_throttle + PID(z_ref - z, dz_ref/dt - vz)
# where z_ref ramps from the engagement height to hover_height (see
# hover_ramp_speed below).
# Why: with climb-rate thrust ArduPilot runs its own height loop on its EKF,
# which indoors follows a junk GPS fix, and this firmware cannot take
# OptiTrack into the EKF (no VISO_TYPE). See THRUST_* in ibvs_controller.py.
#
# raw_hover_throttle is THE critical number. The PID can only move throttle
# raw_thrust_margin either side of it, so if the vehicle's real hover is
# outside that band it cannot hold height at all -- set too HIGH it climbs
# away, too LOW it sinks. It is NOT the FCU's MOT_THST_HOVER (0.18, stale):
# the 2026-09-25 bags hovered at vfr_hud/throttle 0.13-0.15 (ArduPilot's own
# throttle output, the same 0..1 scale a raw-thrust setpoint uses). Re-read it
# after any battery/payload change: hover in STABILIZE and echo
# mavros/vfr_hud/throttle.
#
# Gains are for a ~1.5 rad/s, well-damped loop with 1.0 throttle ~
# g / hover (~70 m/s^2 here), i.e. kp = wn^2*hover/g, kd = 2*0.9*wn*hover/g.
# They SCALE WITH hover -- if raw_hover_throttle changes a lot, scale them.
# Simulated at hover 0.14: 0.5 m step settles to 5 cm in ~7 s, 0.12 m
# overshoot; a real hover anywhere in 0.11-0.17 is still held (dips up to
# ~0.7 m while the integrator catches up at the far ends).
# Flight-tested 2026-09-29-13-38-32.bag: +-2 cm hold near 1 m; big
# engagements were too fast, hence hover_ramp_speed + I frozen while ramping.
# ---------------------------------------------------------------------------
raw_hover_throttle: 0.151     # WITH THE ADDED MASS: middle of the measured range 0.148 (fresh battery,
                              # 2026-10-08-08-15-37) .. 0.159 (drained, 08-45-58). Was 0.148 (08:15 bag: thrust
                              # 0.147-0.149 in the holds). Was 0.133 without it -- change back if
                              # the mass comes off. Re-measure: scripts/hover_throttle_from_bag.py
raw_thrust_margin: 0.04       # max |throttle - hover| the PID may command
                              # (~ +-0.3 g); also bounds how wrong the hover
                              # value may be: covers a real hover of 0.10-0.18
raw_odom_timeout: 0.2         # [s] OptiTrack older than this -> hover + trim
hover_ramp_speed: 0.3         # [m/s] the setpoint starts at the height you
                              # engage at and moves to hover_height at this
                              # speed. 2026-09-29 engagements from 2.1-2.7 m
                              # without it: 0.7-1.3 m/s drops, 0.14-0.47 m
                              # undershoot, 8-10 s creep back.

# APPROACH TEST (simulates the perching approach; thrust_mode 'raw' only).
# Hover at hover_height; once ALIGNED for approach_dwell_s without a break,
# the height setpoint climbs at approach_speed -- ONLY while ALIGNED: it holds
# as soon as alignment or the target is lost and resumes when ALIGNED again --
# and never above approach_max_height. The PILOT ends it (leave GUIDED_NOGPS);
# the next engagement starts over. Status: rostopic echo ibvs/approach
# (IDLE / WAITING / CLIMBING / PAUSED / CEILING).
# NOTE for the floor branch: it was not detected below ~1.2 m
# (2026-10-08-09-32-35.bag: 0 % at 0.8-1.2 m, 98 % at 1.4-1.6 m).
approach_enabled: true
approach_dwell_s: 5.0         # [s] continuously ALIGNED before the climb starts
approach_speed: 0.05          # [m/s] climb rate of the setpoint (5 cm/s; the
                              # X-Y loop needs 5-9 s to settle, so keep it slow)
approach_max_height: 2.0      # [m] ceiling -- the setpoint stops and holds here.
                              # OptiTrack loses the vehicle above ~2.5 m.
pid_z_raw:
  kp: 0.035                   # [throttle/m]  0.5 m low -> +0.018 throttle
  ki: 0.01                    # [throttle/(m*s)] trims a wrong hover throttle
                              # / battery sag -- needed, not optional
  kd: 0.04                    # [throttle per m/s] on OptiTrack vz
  i_max: 0.035                # [throttle] max trim the integrator may add
                              # The integral is FROZEN while the setpoint ramp
                              # moves (see hover_ramp_speed): on the 2026-09-29
                              # big engagements it wound to -0.025 vs a steady
                              # -0.006, which caused the slow creep back.

# ---------------------------------------------------------------------------
# Virtual level camera (scripts/virtual_camera.py) -- removes the image motion
# caused by roll/pitch, in real time from the IMU (exact rotation, see that
# file). It needs only what describes the HARDWARE: how the camera is mounted
# and its intrinsics at the detector's resolution. Nothing here is fitted
# from flight data.
#
# start_optitrack.sh always runs it (SHADOW: ibvs/target_point_virtual next
# to the raw point, both in the bag); the controller flies on it only with
# COMPENSATE=true there.
# ---------------------------------------------------------------------------
camera:
  mount: auto                 # auto = from mission_mode (perch -> up, else
                              # down) | down | up | custom (+ R_BC: 9 numbers,
                              # row-major, body <- camera)
  # INTRINSICS AT image_width x image_height (1280x720, the resolution the
  # detector reports px/py in). Best: fx/fy/cx/cy from a checkerboard
  # calibration AT THAT RESOLUTION -- when fx > 0 they override hfov_deg,
  # and cx/cy default to the image centre.
  #
  # Until then, from the datasheet: DSJ-3079-HE (Sony IMX179), "76-degree
  # field of view" (https://openelab.io/products/usb-camera-module-driver-free).
  # ASSUMED to be the DIAGONAL of the 4:3 sensor, with 1280x720 using the
  # full sensor width:  HFOV = 2*atan(4/5 * tan(76/2)) = 64.0 deg -> fx 1024 px.
  # If the 16:9 mode crops the sensor instead, the true fx is larger and this
  # UNDER-compensates (still in the right direction) -- the props-off tilt
  # test shows it: e_virtual would still follow the tilt a little.
  hfov_deg: 64.0              # datasheet fallback, unused while fx > 0
  # MEASURED 2026-10-02 from 2026-10-02-12-08-33.bag: 2921 detections of the
  # tag at the OptiTrack origin, fitted against the OptiTrack pose (residual
  # median 13 px). fx = fy (square pixels); the free fit gave 968 / 904.
  # The principal point is ~70 px BELOW the image centre (or, equivalently,
  # the camera is pitched ~4 deg on its mount) -- with the old cx/cy = centre
  # that alone put the hover ~10 cm off the tag at 1.5 m.
  fx: 945.0
  fy: 945.0
  cx: 613.0
  cy: 429.0

# ---------------------------------------------------------------------------
# State machine timing / thresholds
# ---------------------------------------------------------------------------
climb_settle_time: 10.0       # [s] CLIMB fallback (ibvs/takeoff path only)
align_tolerance_px: 70        # [px] target must be within this many pixels of
                              # the aim point to count as "aligned" -- the
                              # doubled tolerance, now stated in pixels
                              # directly (was 0.30 m at fx=251/depth 2.0).
                              # Exits ALIGNED at 60 px via align_hysteresis.
align_dwell_time: 1.5         # [s] error must stay aligned this long -> ALIGNED
align_hysteresis: 1.5         # multiplies align_tolerance_px to leave ALIGNED
tag_timeout: 0.5              # [s] no target message within this -> TAG_LOST
