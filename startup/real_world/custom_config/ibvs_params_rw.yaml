# ibvs_controller.py parameters -- REAL WORLD (startup/real_world).
#
# Off-board detection: the PiOS companion detects the target and streams its
# pixel position over UDP; udp_target_receiver republishes ibvs/target_point
# and this controller flies ArduPilot directly (mavros/setpoint_raw/attitude).
# There is NO range sensor and NO OptiTrack -- the vertical axis is open-rate.
#
# The safety pilot flies MANUALLY (STABILIZE). The controller streams
# setpoints continuously; ArduPilot only acts on them in GUIDED_NOGPS, which
# the controller seizes itself on the first fresh target point. The pilot
# takes back control with the RC mode switch.
#
# GUID_OPTIONS must be 0 on the FCU (set in the startup session): thrust is a
# CLIMB RATE (0.0 max descent, 0.5 hover, 1.0 max climb), NOT raw thrust.

# ---------------------------------------------------------------------------
# Mission mode: 'land' (down cam, descend + disarm) or 'perch' (up cam, climb
# toward the branch). Override per run from the launch (mission_mode:=perch).
# ---------------------------------------------------------------------------
mission_mode: land

# NOTE: ~image_width/~image_height (the camera resolution -- the only thing
# the controller needs to know about the camera; no intrinsics, no
# calibration) are NOT set here -- set them, together, on the controller AND
# udp_target_receiver via the launch file's image_width/image_height args
# (see launch/ibvs_udp.launch and start_udp.sh), so they can't drift.

# Image->body sign per axis (absorb the camera flip + detector pixel-sign
# convention). Defaults suit the down-facing landing camera; the up-facing
# perch camera typically needs one or both at -1.0 -- VERIFY before flying.
image_x_sign: 1.0
image_y_sign: 1.0

# ---------------------------------------------------------------------------
# Engagement (real world): nothing is primed at startup. The controller
# seizes GUIDED_NOGPS itself on a fresh target point; ibvs/start and
# ibvs/stop work either way.
# ---------------------------------------------------------------------------
engage_on_target: true
engage_needs_start: false     # false = the FIRST fresh target point while
                              # armed engages (no ibvs/start needed);
                              # true = ibvs/start first, NEXT point engages

control_rate: 30.0            # [Hz] rate at which AttitudeTarget is published

# ---------------------------------------------------------------------------
# Vertical axis -- open-rate climb control through the thrust field (no range
# sensor). 0.0 max descent, 0.5 hover, 1.0 max climb.
# ---------------------------------------------------------------------------
hover_thrust: 0.5             # zero-climb-rate ("hover") command
climb_thrust: 0.52            # only used by the ibvs/takeoff CLIMB path
thrust_min: 0.45              # clamp: gentlest allowed descent command
thrust_max: 0.6               # clamp: strongest allowed climb command
takeoff_height: 1.0           # [m] only used by the ibvs/takeoff CLIMB path

perch_climb_thrust: 0.55      # PERCH: constant climb while centered on the branch
land_descend_thrust: 0.45     # LAND: constant slow descent while centered

# LAND terminal: disarm once centered (within descend_xy_gate_px) and below
# land_disarm_height (odometry altitude), held for land_disarm_dwell seconds.
disarm_on_land: true
land_disarm_height: 0.15      # [m] odometry altitude below which disarm triggers
land_disarm_dwell: 0.3        # [s] condition must hold this long before disarm

# ---------------------------------------------------------------------------
# X-Y axis -- closed-loop IBVS cascade on the target's pixel error, as a
# FRACTION of the half-frame (0 = centered, +-1 = frame edge):
#   desired_tilt = PID_xy(frame-fraction error), body_rate = kp_att * (tilt error)
# ---------------------------------------------------------------------------
target_x: 0.0                 # desired lateral offset, frame-fraction (0 = centered)
target_y: 0.0                 # desired lateral offset, frame-fraction (0 = centered)
descend_xy_gate_px: 60         # [px] descend/climb only while centered within this
                              # many pixels of center -- retune by flying it

max_tilt: 0.15                # [rad] desired-tilt clamp (~8.5 deg)
kp_att: 1.5                   # body rate per rad of attitude error [1/s]
max_body_rate: 0.35           # [rad/s] clamp for both roll/pitch rate (~20 deg/s)
kp_hover: 0.15                # position-hold P outside ALIGN [rad/m]
kv_hover: 0.25                # velocity damping for the position hold [rad per m/s]

# ---------------------------------------------------------------------------
# PID gains -- carried over numerically from the old metric gains as a
# STARTING POINT ONLY. The error is now dimensionless (frame-fraction,
# roughly -1..1 instead of unbounded meters): retune by flying it.
# X-Y only -- the vertical axis is open-rate, there is no Z PID.
# ---------------------------------------------------------------------------
pid_xy:
  kp: 0.10                    # desired tilt per unit of frame-fraction error [rad]
  ki: 0.0                     # [rad/s]
  kd: 0.15                    # [rad per unit/s] velocity damping -- keep > 0
  i_max: 0.05                 # [rad] max integral contribution

# ---------------------------------------------------------------------------
# State machine timing / thresholds
# ---------------------------------------------------------------------------
climb_settle_time: 10.0       # [s] CLIMB fallback (ibvs/takeoff path only)
align_tolerance_px: 20         # [px] target must be within this many pixels of
                              # center to count as "aligned" -- retune by flying it
align_dwell_time: 2.0         # [s] error must stay aligned this long -> ALIGNED
align_hysteresis: 1.5         # multiplies align_tolerance_px to leave ALIGNED
tag_timeout: 0.5              # [s] no target message within this -> TAG_LOST
