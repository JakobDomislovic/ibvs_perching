# ibvs_controller.py parameters
#
# The controller is a small state machine (see ibvs_controller.py) that
# talks to ArduPilot directly through mavros/setpoint_raw/attitude, i.e.
# WITHOUT the uav_ros_stack tracker/controller running.

control_rate: 30.0            # [Hz] rate at which AttitudeTarget is published

# NOTE: ~image_width/~image_height (the camera resolution -- the only thing
# the controller needs to know about the camera) are NOT set here. They are
# set ONCE, together, on all three nodes (this controller, aruco_detector.py,
# mock_ar_tag_publisher.py) via the image_width/image_height args in
# launch/ibvs_perching.launch, so the three can never drift out of sync.

# ---------------------------------------------------------------------------
# Mid-flight engagement (fly manually with the keyboard joystick, then let
# IBVS take over). engage_on_target lets the controller seize GUIDED_NOGPS
# itself on a fresh ibvs/target_point; engage_needs_start gates that behind
# an ibvs/start call first ('i' on the keyboard joystick, a real joystick
# button later) so seeing the tag alone never grabs control. The classic
# service mission (ibvs/takeoff -> ibvs/start) is unaffected.
# ---------------------------------------------------------------------------
engage_on_target: true
engage_needs_start: true

# ---------------------------------------------------------------------------
# Z axis -- climb rate through the AttitudeTarget "thrust" field.
#
# In GUIDED/GUIDED_NOGPS ArduPilot interprets thrust as a CLIMB RATE
# (unless GUID_OPTIONS bit 3 is set):
#   0.0 = max descent, 0.5 = zero climb rate (hover), 1.0 = max climb.
# Takeoff therefore REQUIRES a value above 0.5 -- that is climb_thrust.
# ---------------------------------------------------------------------------
hover_thrust: 0.5             # zero-climb-rate ("hover") command
climb_thrust: 0.52            # sent during CLIMB -> this is what makes it take off
thrust_min: 0.45              # clamp: gentlest allowed descent command
thrust_max: 0.6               # clamp: strongest allowed climb command
takeoff_height: 1.0           # [m] CLIMB ends when odometry z reaches this

# No depth from the vision module -> no standoff to regulate toward, and
# FOR NOW no depth-free descent strategy is enabled either: ALIGN/ALIGNED
# hold the ODOMETRY height the vehicle was at when servoing started
# (latched in transition(), NOT takeoff_height), regulated below rather
# than trusting an open-loop hover_thrust to hold still. Centering the
# target laterally does not by itself bring the vehicle any closer to it
# (see README limitations for what adding descent back would take).
kp_alt_hold: 0.3               # thrust delta per meter of height error
kv_alt_hold: 0.2               # thrust delta per m/s of climb-rate damping

# ---------------------------------------------------------------------------
# X-Y axis -- closed-loop IBVS cascade on the target's pixel error, expressed
# as a FRACTION of the half-frame (0 = centered, +-1 = frame edge; see
# target_callback in ibvs_controller.py), in the body FLU frame convention
# (x-forward, y-left, z-up):
#   desired_tilt = PID_xy(frame-fraction error)       (clamped to max_tilt)
#   body_rate    = kp_att * (desired_tilt - current_tilt)
# A raw rate command proportional to position error is UNSTABLE (the rate
# integrates into an unbounded tilt); the attitude inner loop is required.
# ---------------------------------------------------------------------------
target_x: 0.0                 # desired lateral offset, frame-fraction (0 = centered)
target_y: 0.0                 # desired lateral offset, frame-fraction (0 = centered)

max_tilt: 0.15                # [rad] desired-tilt clamp (~8.5 deg)
kp_att: 1.5                   # body rate per rad of attitude error [1/s]
max_body_rate: 0.35           # [rad/s] clamp for both roll/pitch rate (~20 deg/s)
kp_hover: 0.15                # position-hold P outside ALIGN [rad/m]; HOVER and
                              # TAG_LOST hold the latched spot (takeoff point /
                              # wherever servoing stopped) -- level attitude
                              # alone drifts away on attitude trim bias
kv_hover: 0.25                # velocity damping for the position hold [rad per m/s]
                              # (kp_alt_hold/kv_alt_hold above are the Z-axis
                              # equivalent, for ALIGN/ALIGNED's height hold)

# ---------------------------------------------------------------------------
# PID gains. I and D start at 0 (pure P) -- raise them only when tuning.
# The D-term uses body velocity from odometry as a damping proxy -- with a
# metric error this was an EXACT derivative; with a frame-fraction error
# (no depth) it's only approximate, since the same velocity produces a
# bigger apparent pixel motion the closer the vehicle is to the target.
# i_max bounds the INTEGRAL CONTRIBUTION (anti-windup), not the raw sum.
# Values below carried over numerically from the old metric gains as a
# STARTING POINT ONLY -- the error is now dimensionless (roughly -1..1
# instead of unbounded meters), so these need retuning by flying it.
# ---------------------------------------------------------------------------
pid_xy:
  kp: 0.15                    # desired tilt per unit of frame-fraction error [rad]
  ki: 0.002                   # [rad/s]
  kd: 0.15                    # [rad per unit/s] -- damps the X-Y approach so it
                              # doesn't oscillate (flight-tested with descent
                              # enabled; kept as the starting point)
  i_max: 0.05                 # [rad] max integral contribution

# ---------------------------------------------------------------------------
# State machine timing / thresholds
# ---------------------------------------------------------------------------
climb_settle_time: 10.0       # [s] CLIMB fallback timeout if takeoff_height is never reached
align_tolerance_px: 20         # [px] target must be within this many pixels of
                              # center to count as "aligned" -- retune by flying it
align_dwell_time: 2.0         # [s] error must stay aligned this long -> ALIGNED
align_hysteresis: 1.5         # multiplies align_tolerance_px to leave ALIGNED
tag_timeout: 0.5              # [s] no tag message within this time -> TAG_LOST
                              # (short: at 30 fps detection, 0.5 s of silence
                              # is a real loss, not a dropped frame)
