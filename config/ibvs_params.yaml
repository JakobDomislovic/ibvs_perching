# ibvs_controller.py parameters
#
# The controller is a small state machine (see ibvs_controller.py) that
# talks to ArduPilot directly through mavros/setpoint_raw/attitude, i.e.
# WITHOUT the uav_ros_stack tracker/controller running.

control_rate: 30.0            # [Hz] rate at which AttitudeTarget is published

# ---------------------------------------------------------------------------
# Mission mode -- what the vertical axis does once centered on the target.
#   land   down-facing camera, target below: descend onto it then DISARM.
#          Uses the range hint (point.z) as height above the target.
#   perch  up-facing camera, branch above: climb toward it while centered.
#          Range is ignored; the safety pilot commits the final grab.
# Override per run from the launch (mission_mode:=perch).
# ---------------------------------------------------------------------------
mission_mode: land

# NOTE: ~image_width/~image_height (the camera resolution -- the only thing
# the controller needs to know about the camera; no intrinsics, no
# calibration) are NOT set here -- set them, together, on the controller AND
# the vision module (udp_target_receiver / aruco_detector) via the launch
# file's image_width/image_height args, so they can't drift.

# Image->body sign per axis (see ibvs_controller.py). The vision interface is
# fixed (point.x positive RIGHT, point.y positive DOWN); these absorb the
# camera flip (down vs up mount) and the detector's pixel-sign convention.
# Verify so a target off to one side produces a correction TOWARD
# it. Defaults suit the down-facing landing camera; the up-facing perch
# camera typically needs one or both flipped to -1.0 -- verify before flight.
image_x_sign: 1.0
image_y_sign: 1.0

# PERCH: constant climb-rate command while centered on the branch above
# (> hover_thrust climbs; clamped to thrust_max).
perch_climb_thrust: 0.55

# LAND: constant slow descent while centered (< hover_thrust descends;
# clamped to thrust_min). There is no range sensor -- the descent is
# open-rate and the terminal disarm uses odometry altitude.
land_descend_thrust: 0.45

# LAND: touchdown -> disarm once centered (within descend_xy_gate_px) and below
# land_disarm_height, held for land_disarm_dwell seconds (debounce). Set
# disarm_on_land false to descend-and-hold instead of cutting the motors.
disarm_on_land: true
land_disarm_height: 0.15      # [m] odometry altitude below which disarm triggers
land_disarm_dwell: 0.3        # [s] condition must hold this long before disarm

# ---------------------------------------------------------------------------
# Mid-flight engagement (fly manually with the keyboard joystick, then let
# IBVS take over). engage_on_target lets the controller seize GUIDED_NOGPS
# itself on a fresh ibvs/target_point; engage_needs_start gates that behind
# an ibvs/start call first ('i' on the keyboard joystick, a real joystick
# button later) so seeing the tag alone never grabs control. The classic
# service mission (ibvs/takeoff -> ibvs/start) is unaffected.
# ---------------------------------------------------------------------------
engage_on_target: true
engage_needs_start: true

# ---------------------------------------------------------------------------
# Z axis -- climb rate through the AttitudeTarget "thrust" field.
#
# In GUIDED/GUIDED_NOGPS ArduPilot interprets thrust as a CLIMB RATE
# (unless GUID_OPTIONS bit 3 is set):
#   0.0 = max descent, 0.5 = zero climb rate (hover), 1.0 = max climb.
# Takeoff therefore REQUIRES a value above 0.5 -- that is climb_thrust.
# There is NO range sensor: the vertical axis is open-rate (see
# land_descend_thrust / perch_climb_thrust above), not target-relative.
# ---------------------------------------------------------------------------
hover_thrust: 0.5             # zero-climb-rate ("hover") command
climb_thrust: 0.52            # sent during CLIMB -> this is what makes it take off
thrust_min: 0.45              # clamp: gentlest allowed descent command
thrust_max: 0.6               # clamp: strongest allowed climb command
takeoff_height: 1.0           # [m] CLIMB ends when odometry z reaches this

# ---------------------------------------------------------------------------
# X-Y axis -- closed-loop IBVS cascade on the target's pixel error, as a
# FRACTION of the half-frame (0 = centered, +-1 = frame edge):
#   desired_tilt = PID_xy(frame-fraction error), body_rate = kp_att * (tilt error)
# A raw rate command proportional to position error is UNSTABLE (the rate
# integrates into an unbounded tilt); the attitude inner loop is required.
# ---------------------------------------------------------------------------
target_x: 0.0                 # desired lateral offset, frame-fraction (0 = centered)
target_y: 0.0                 # desired lateral offset, frame-fraction (0 = centered)
descend_xy_gate_px: 60         # [px] descend/climb only while centered within this
                              # many pixels of center (keeps the tag inside the
                              # shrinking camera FOV) -- retune by flying it

max_tilt: 0.15                # [rad] desired-tilt clamp (~8.5 deg)
kp_att: 1.5                   # body rate per rad of attitude error [1/s]
max_body_rate: 0.35           # [rad/s] clamp for both roll/pitch rate (~20 deg/s)
kp_hover: 0.15                # position-hold P outside ALIGN [rad/m]; HOVER and
                              # TAG_LOST hold the latched spot (takeoff point /
                              # wherever servoing stopped) -- level attitude
                              # alone drifts away on attitude trim bias
kv_hover: 0.25                # velocity damping for the position hold [rad per m/s]

# ---------------------------------------------------------------------------
# PID gains. I and D start at 0 (pure P) -- raise them only when tuning.
# The error is dimensionless (frame-fraction, roughly -1..1 instead of
# unbounded meters) -- these numeric values are carried over from the old
# metric gains as a STARTING POINT ONLY; retune by flying it. The D-term
# uses body velocity from odometry as a damping proxy (NEEDED while
# descending/climbing: with kd 0 the undamped X-Y oscillation outruns the
# shrinking FOV and the tag leaves the frame). i_max bounds the INTEGRAL
# CONTRIBUTION (anti-windup), not the raw sum.
# ---------------------------------------------------------------------------
pid_xy:
  kp: 0.15                    # desired tilt per unit of frame-fraction error [rad]
  ki: 0.002                   # [rad/s]
  kd: 0.15                    # [rad per unit/s] velocity damping
  i_max: 0.05                 # [rad] max integral contribution

# ---------------------------------------------------------------------------
# State machine timing / thresholds
# ---------------------------------------------------------------------------
climb_settle_time: 10.0       # [s] CLIMB fallback timeout if takeoff_height is never reached
align_tolerance_px: 20         # [px] target must be within this many pixels of
                              # center to count as "aligned" -- retune by flying it
align_dwell_time: 2.0         # [s] error must stay aligned this long -> ALIGNED
align_hysteresis: 1.5         # multiplies align_tolerance_px to leave ALIGNED
tag_timeout: 0.5              # [s] no tag message within this time -> TAG_LOST
                              # (short: at 30 fps detection, 0.5 s of silence is
                              # a real loss, and stale-data descent near the
                              # ground must stop quickly)
