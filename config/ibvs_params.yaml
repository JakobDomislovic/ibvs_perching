# ibvs_controller.py parameters
#
# The controller is a small state machine (see ibvs_controller.py) that
# talks to ArduPilot directly through mavros/setpoint_raw/attitude, i.e.
# WITHOUT the uav_ros_stack tracker/controller running.

control_rate: 30.0            # [Hz] rate at which AttitudeTarget is published

# ---------------------------------------------------------------------------
# Mission mode -- what the vertical axis does once centered on the target.
#   land   down-facing camera, target below: descend onto it then DISARM.
#          Open-rate descent; the terminal disarm uses odometry altitude.
#   perch  up-facing camera, branch above: climb toward it while centered.
#          Range is ignored; the safety pilot commits the final grab.
# Override per run from the launch (mission_mode:=perch).
# ---------------------------------------------------------------------------
mission_mode: land

# Image->body sign per axis. The controller's vision interface assumes the
# usual top-left-origin image convention: point.x positive RIGHT, point.y
# positive DOWN.
#
# THIS IS THE SIMULATION CONFIG. aruco_detector.py publishes OpenCV's own
# (u, v) from detectMarkers -- u right, v down, top-left origin -- which
# already MATCHES that assumption, so both signs are +1.0 here.
#
# Do NOT copy the real-world values: the PiOS detector uses x positive LEFT
# and y positive UP, so custom_config/ibvs_params_rw.yaml needs -1.0/-1.0.
# The two setups genuinely differ; that mismatch is why the real aircraft
# drove away from the tag while the simulation converged.
#
# These knobs mirror the ERROR about the image centre and never move the aim
# point, so a detection dead centre stays zero-error whatever they are.
image_x_sign: 1.0             # sim: OpenCV u is positive RIGHT (as assumed)
image_y_sign: 1.0             # sim: OpenCV v is positive DOWN  (as assumed)

# PERCH: constant climb-rate command while centered on the branch above
# (> hover_thrust climbs; clamped to thrust_max).
perch_climb_thrust: 0.55

# LAND: constant slow descent while centered (< hover_thrust descends;
# clamped to thrust_min). There is no range sensor -- the descent is
# open-rate and the terminal disarm uses odometry altitude.
land_descend_thrust: 0.45

# LAND: touchdown -> disarm once centered (within descend_xy_gate) and below
# land_disarm_height, held for land_disarm_dwell seconds (debounce). Set
# disarm_on_land false to descend-and-hold instead of cutting the motors.
disarm_on_land: true
land_disarm_height: 0.15      # [m] odometry altitude below which disarm triggers
land_disarm_dwell: 0.3        # [s] condition must hold this long before disarm

# ---------------------------------------------------------------------------
# Mid-flight engagement (fly manually with the keyboard joystick, then let
# IBVS take over). engage_on_target lets the controller skip CLIMB and servo
# straight away once it is armed and in GUIDED_NOGPS. It does NOT switch the
# mode: the PILOT selects GUIDED_NOGPS, and ibvs/start enables servoing.
# The classic service mission (ibvs/takeoff -> ibvs/start) is unaffected.
# ---------------------------------------------------------------------------
engage_on_target: true

# ---------------------------------------------------------------------------
# Z axis -- climb rate through the AttitudeTarget "thrust" field.
#
# In GUIDED/GUIDED_NOGPS ArduPilot interprets thrust as a CLIMB RATE
# (unless GUID_OPTIONS bit 3 is set):
#   0.0 = max descent, 0.5 = zero climb rate (hover), 1.0 = max climb.
# Takeoff therefore REQUIRES a value above 0.5 -- that is climb_thrust.
# There is NO range sensor: the vertical axis is open-rate (see
# land_descend_thrust / perch_climb_thrust above), not target-relative.
# ---------------------------------------------------------------------------
hover_thrust: 0.5             # zero-climb-rate ("hover") command
climb_thrust: 0.52            # sent during CLIMB -> this is what makes it take off
thrust_min: 0.45              # clamp: gentlest allowed descent command
thrust_max: 0.6               # clamp: strongest allowed climb command
takeoff_height: 1.0           # [m] CLIMB ends when odometry z reaches this

# ---------------------------------------------------------------------------
# X-Y axis -- CASCADE on the image error, with an IMU attitude inner loop:
#   desired_tilt = PID_xy(error)                     (clamped to max_tilt)
#   body_rate    = kp_att * (desired_tilt - current_tilt)
# The error is the detection's offset from centre, normalized per axis by its
# own half-dimension, so it is +-1.0 at that axis' frame edge. No fx/fy, no
# depth_guess, NO CAMERA CALIBRATION anywhere in the chain.
# ~image_width / ~image_height come from ibvs_perching.launch (640x480 for the
# sim camera) so they cannot drift from the resolution the detector reports.
#
# Attitude comes from mavros/imu/data (the FCU's AHRS) -- no position solution
# needed, so the same code path works in sim and on the real aircraft.
# ---------------------------------------------------------------------------
target_x: 0.0                 # desired lateral offset, frame-fraction (0 = centred)
target_y: 0.0                 # desired lateral offset, frame-fraction (0 = centred)
descend_xy_gate_px: 60        # [px] descend only while centred within this radius
                              # (keeps the tag inside the shrinking camera FOV).
                              # Kept LARGER than align_tolerance_px so ALIGNED
                              # always implies the descent is allowed.

max_tilt: 0.15                # [rad] desired-tilt clamp (~8.5 deg). THE key
                              # safety limit: never commanded steeper than this.
kp_att: 1.5                   # [1/s] inner loop: body rate per rad of tilt error
max_body_rate: 0.35           # [rad/s] clamp for both roll/pitch rate (~20 deg/s).
                              # Keep >= kp_att * max_tilt (= 0.225 here).

# ---------------------------------------------------------------------------
# OUTER-loop PID gains. UNITS: kp is rad of TILT per unit frame-fraction, so
# kp IS the tilt commanded at the frame edge (kp 0.10 => 5.7 deg there). A
# TILT, not a rate -- the inner attitude loop turns it into one.
#
# These suit the SIM detector's 15 Hz (aruco_detector ~process_rate), i.e. a
# ~0.067 s gap between detections. Gains tolerable here are NOT safe on the
# real aircraft, whose detector measures 3.8-5.9 Hz (median gap 0.157 s) --
# overshoot grows sharply as detection rate drops, so the real-world config
# uses gentler values. See the measured table in
# startup/real_world/custom_config/ibvs_params_rw.yaml.
#
# The D term differentiates the DETECTION (there is no body-velocity estimate
# in the real-world setup, so the same source is used in both). With the
# cascade, kd=0 no longer DIVERGES the way the old bare-rate law did, but it
# still oscillates without settling -- keep kd non-zero.
# i_max bounds the INTEGRAL CONTRIBUTION (anti-windup), not the raw sum.
# ---------------------------------------------------------------------------
pid_xy:
  kp: 0.10                    # [rad per unit] tilt at the frame edge (~5.7 deg)
  ki: 0.0
  kd: 0.15                    # [rad per unit/s] keep > 0 or it will not settle
  i_max: 0.05                 # max integral contribution
  d_filter: 0.15              # EMA on the differentiated detection (1.0 = off)
  d_max_dt: 0.20              # [s] longest detection gap still differentiated;
                              # beyond it the D term is zeroed instead of
                              # computed across the gap. ~3x the sim's 0.067 s
                              # detection gap, so D survives normal frames and
                              # is only dropped across a genuine stall. (Keep
                              # this comfortably ABOVE the actual gap or kd
                              # goes inert -- that is what happened in the
                              # real-world config, see ibvs_params_rw.yaml.)

# ---------------------------------------------------------------------------
# State machine timing / thresholds
# ---------------------------------------------------------------------------
climb_settle_time: 10.0       # [s] CLIMB fallback timeout if takeoff_height is never reached
align_tolerance_px: 40        # [px] target must be within this many pixels of
                              # the aim point to count as "aligned" -- the
                              # doubled tolerance, stated in pixels directly.
                              # Exits ALIGNED at 60 px via align_hysteresis.
align_dwell_time: 2.0         # [s] error must stay aligned this long -> ALIGNED
align_hysteresis: 1.5         # multiplies align_tolerance_px to leave ALIGNED
tag_timeout: 0.5              # [s] no tag message within this time -> TAG_LOST
                              # (short: at 30 fps detection, 0.5 s of silence is
                              # a real loss, and stale-data descent near the
                              # ground must stop quickly)
